<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,follow">
  <title>Redirecting…</title>
  <script>
    (function (l) {
      var path = l.pathname + l.search;
      l.replace(l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(path) + l.hash);
    })(window.location);
  </script>
</head>
<body></body>
</html>
